name: Build and Publish Android APKs

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which application to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - chat
          - social
      release_tag:
        description: 'GitHub Release tag'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-chat:
    name: Build HiMewo Chat APK
    if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == 'chat' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Restore Signing Keystore
        run: |
          mkdir -p credentials
          echo "${{ secrets.CHAT_KEYSTORE_BASE64 }}" | base64 -d > credentials/chat-release.keystore

      - name: Expo Prebuild (Mobile Chat)
        env:
          EXPO_PUBLIC_DOMAIN: workspaceapi-server-production-5e99.up.railway.app
          EXPO_PUBLIC_SUPABASE_URL: https://rzdfgbfyhnkvqbcegguk.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6ZGZnYmZ5aG5rdnFiY2VnZ3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDgwODMsImV4cCI6MjA5Nzk4NDA4M30.8RlmkHFpDxDGmZ1KJg3bnswfy6my8FRT0Su_F1fu5CU
        run: |
          cd artifacts/mobile-chat
          npx expo prebuild --platform android --no-install --clean

      - name: Assemble Release APK
        run: |
          cd artifacts/mobile-chat/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Optimize and Sign APK with Release Keystore
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          UNSIGNED_APK=$(find artifacts/mobile-chat/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found built APK: $UNSIGNED_APK"

          python3 -c "
          import zipfile
          with zipfile.ZipFile('$UNSIGNED_APK', 'r') as zin, zipfile.ZipFile('artifacts/mobile-chat/chat-arm.apk', 'w', compression=zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  if item.filename.startswith('lib/x86/') or item.filename.startswith('lib/x86_64/') or item.filename.startswith('META-INF/'):
                      continue
                  zout.writestr(item, zin.read(item.filename))
          "

          $BUILD_TOOLS_DIR/zipalign -p -f 4 artifacts/mobile-chat/chat-arm.apk artifacts/mobile-chat/chat-aligned.apk

          $BUILD_TOOLS_DIR/apksigner sign \
            --ks credentials/chat-release.keystore \
            --ks-key-alias "${{ secrets.CHAT_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.CHAT_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.CHAT_KEY_PASSWORD }}" \
            --out artifacts/mobile-chat/himewo-chat.apk \
            artifacts/mobile-chat/chat-aligned.apk

          $BUILD_TOOLS_DIR/apksigner verify --verbose artifacts/mobile-chat/himewo-chat.apk
          ls -lh artifacts/mobile-chat/himewo-chat.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: himewo-chat-apk
          path: artifacts/mobile-chat/himewo-chat.apk

      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'v1.2.0' }}"
          node scripts/publish-release.mjs artifacts/mobile-chat/himewo-chat.apk himewo-chat.apk "$TAG"
          node scripts/publish-release.mjs artifacts/mobile-chat/himewo-chat.apk himewo-chat.apk "v1.0.0" || true

  build-social:
    name: Build HiMewo Social APK
    if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == 'social' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Restore Signing Keystore
        run: |
          mkdir -p credentials
          echo "${{ secrets.SOCIAL_KEYSTORE_BASE64 }}" | base64 -d > credentials/social-release.keystore

      - name: Expo Prebuild (Mobile Social)
        env:
          EXPO_PUBLIC_DOMAIN: workspaceapi-server-production-5e99.up.railway.app
          EXPO_PUBLIC_SUPABASE_URL: https://rzdfgbfyhnkvqbcegguk.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6ZGZnYmZ5aG5rdnFiY2VnZ3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDgwODMsImV4cCI6MjA5Nzk4NDA4M30.8RlmkHFpDxDGmZ1KJg3bnswfy6my8FRT0Su_F1fu5CU
        run: |
          cd artifacts/mobile
          npx expo prebuild --platform android --no-install --clean

      - name: Assemble Release APK
        run: |
          cd artifacts/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Optimize and Sign APK with Release Keystore
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          UNSIGNED_APK=$(find artifacts/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found built APK: $UNSIGNED_APK"

          python3 -c "
          import zipfile
          with zipfile.ZipFile('$UNSIGNED_APK', 'r') as zin, zipfile.ZipFile('artifacts/mobile/social-arm.apk', 'w', compression=zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  if item.filename.startswith('lib/x86/') or item.filename.startswith('lib/x86_64/') or item.filename.startswith('META-INF/'):
                      continue
                  zout.writestr(item, zin.read(item.filename))
          "

          $BUILD_TOOLS_DIR/zipalign -p -f 4 artifacts/mobile/social-arm.apk artifacts/mobile/social-aligned.apk

          $BUILD_TOOLS_DIR/apksigner sign \
            --ks credentials/social-release.keystore \
            --ks-key-alias "${{ secrets.SOCIAL_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.SOCIAL_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.SOCIAL_KEY_PASSWORD }}" \
            --out artifacts/mobile/himewo-social.apk \
            artifacts/mobile/social-aligned.apk

          $BUILD_TOOLS_DIR/apksigner verify --verbose artifacts/mobile/himewo-social.apk
          ls -lh artifacts/mobile/himewo-social.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: himewo-social-apk
          path: artifacts/mobile/himewo-social.apk

      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'v1.2.0' }}"
          node scripts/publish-release.mjs artifacts/mobile/himewo-social.apk himewo-social.apk "$TAG"
          node scripts/publish-release.mjs artifacts/mobile/himewo-social.apk himewo-social.apk "v1.0.0" || true
